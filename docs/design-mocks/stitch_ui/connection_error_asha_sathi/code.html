<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ASHA Sathi - Connection Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#cadbfc",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#00752a",
                        "tertiary-fixed": "#b6ebff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#a9c7ff",
                        "surface-bright": "#f9f9ff",
                        "tertiary": "#004e61",
                        "surface-tint": "#005db6",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#00468c",
                        "on-secondary-fixed": "#002107",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#006880",
                        "on-primary-container": "#c8daff",
                        "on-surface-variant": "#424752",
                        "primary": "#00478d",
                        "outline": "#727783",
                        "surface-container-high": "#dfe8ff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#001f28",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-fixed": "#001b3d",
                        "secondary": "#006e28",
                        "primary-container": "#005eb8",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "surface": "#f9f9ff",
                        "inverse-surface": "#20314b",
                        "surface-container": "#e7eeff",
                        "on-tertiary-container": "#9be4ff",
                        "surface-container-highest": "#d6e3ff",
                        "secondary-container": "#82fc90",
                        "on-surface": "#091c35",
                        "error-container": "#ffdad6",
                        "background": "#f9f9ff",
                        "secondary-fixed-dim": "#65df77",
                        "on-secondary-fixed-variant": "#00531c",
                        "on-background": "#091c35",
                        "secondary-fixed": "#82fc90",
                        "outline-variant": "#c2c6d4",
                        "tertiary-fixed-dim": "#57d5fc",
                        "inverse-primary": "#a9c7ff",
                        "surface-variant": "#d6e3ff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#004e60",
                        "inverse-on-surface": "#ecf0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xxl": "48px",
                        "unit": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "xs": "4px",
                        "form-gap": "20px",
                        "md": "16px",
                        "xl": "32px",
                        "touch-target": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg-mobile": ["Inter"],
                        "caption": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg-mobile": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Top Navigation Suppressed: Transactional/Error State -->
<!-- Bottom Navigation Suppressed: Transactional/Error State -->
<!-- Main Content Canvas -->
<main class="flex flex-col items-center justify-center w-full px-lg max-w-md mx-auto z-10 text-center relative pt-xl pb-xxl flex-grow">
<!-- Error Illustration / Icon Container -->
<div class="relative w-32 h-32 mb-lg flex items-center justify-center rounded-full bg-error-container text-on-error-container shadow-sm">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">cloud_off</span>
<!-- Pulse Effect behind icon to draw attention -->
<div class="absolute inset-0 rounded-full border-4 border-error-container animate-ping opacity-75"></div>
</div>
<!-- Error Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Connection Error</h1>
<!-- Error Explanation -->
<p class="font-body-lg-mobile text-body-lg-mobile text-on-surface-variant mb-xl px-md">
            We are having trouble reaching the server. Your data is safely stored locally and will upload when you reconnect.
        </p>
<!-- Actions Container -->
<div class="w-full flex flex-col gap-form-gap">
<!-- Primary Action: Retry -->
<button aria-label="Retry Connection" class="w-full h-touch-target bg-primary-container text-on-primary rounded-full font-label-md text-label-md flex items-center justify-center gap-sm shadow-sm hover:bg-primary transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">refresh</span>
                Retry Connection
            </button>
<!-- Secondary Action: Open Sync Center -->
<button aria-label="Open Sync Center" class="w-full h-touch-target bg-transparent border-2 border-outline-variant text-primary rounded-full font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-surface-variant transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">sync</span>
                Open Sync Center
            </button>
</div>
<!-- Offline Status Badge (Persistent indicator context) -->
<div class="mt-xl inline-flex items-center gap-xs px-md py-xs rounded-full bg-surface-container-high border border-outline-variant">
<div class="w-2 h-2 rounded-full bg-outline"></div>
<span class="font-caption text-caption text-on-surface-variant">Currently Offline</span>
</div>
</main>
</body></html>
