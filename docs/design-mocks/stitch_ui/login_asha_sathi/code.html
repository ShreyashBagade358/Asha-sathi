<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ASHA Sathi - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>

                        "outline-variant": "#c2c6d4",

                        "surface-tint": "#005db6",
                        "secondary-fixed": "#82fc90",
                        "primary-fixed-dim": "#a9c7ff",
                        "on-primary": "#ffffff",

                        "on-surface": "#091c35"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "touch-target": "48px",
                        "unit": "4px",

                        "xs": "4px",

                        "md": "16px"

                    "fontFamily": {

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>

<body class="bg-surface text-on-surface h-screen w-full flex items-center justify-center p-md overflow-hidden antialiased">
<!-- Decorative Background Shape -->
<div class="absolute top-0 right-0 w-2/3 h-full bg-primary-container opacity-20 -z-10 rounded-bl-full hidden md:block"></div>
<div class="absolute bottom-0 left-0 w-full h-1/3 bg-surface-container -z-10 block md:hidden"></div>
<div class="w-full max-w-md bg-surface-container-lowest md:rounded-xl md:shadow-[0px_8px_16px_rgba(0,0,0,0.1)] border md:border-outline-variant/30 flex flex-col overflow-hidden h-full md:h-auto border-none shadow-none md:p-0">
<!-- Header Section -->
<div class="px-lg pt-xl pb-md flex flex-col items-center text-center bg-surface-container-lowest">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-display-lg" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary font-bold tracking-tight">ASHA Sathi</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Login to access your healthcare portal</p>
</div>
<!-- Form Section -->
<div class="px-lg pb-xl flex-grow flex flex-col justify-center bg-surface-container-lowest">
<!-- Role Selection (Visual Cue) -->
<div class="flex justify-center mb-lg gap-sm">
<button class="px-md py-sm rounded-full font-label-md text-label-md bg-primary text-on-primary border border-primary transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 18px; font-variation-settings: 'FILL' 1;">medical_services</span>
                    Health Worker
                </button>
<button class="px-md py-sm rounded-full font-label-md text-label-md bg-surface-container text-on-surface-variant border border-outline-variant hover:bg-surface-container-high transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 18px;">person</span>
                    Patient
                </button>
</div>
<form class="space-y-form-gap">
<!-- Mobile Number Input -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="mobile">Mobile Number or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">phone_iphone</span>
<input class="w-full h-[48px] pl-10 pr-sm py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all placeholder:text-outline" id="mobile" placeholder="Enter mobile or email" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[48px] bg-[#005EB8] hover:bg-primary text-on-primary rounded-lg font-label-md text-label-md shadow-sm hover:shadow transition-all flex items-center justify-center gap-sm mt-md group" type="button">
                    Send OTP
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="flex justify-center pt-sm">
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant hover:underline transition-colors" href="#">Login with Password</a>
</div>
</form>
<!-- Contextual Helper -->
<div class="mt-xl p-md bg-surface-container-low rounded-lg border border-outline-variant/50 flex gap-md items-start">
<span class="material-symbols-outlined text-tertiary-container mt-xs" style="font-variation-settings: 'FILL' 1;">info</span>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Need Help?</h3>
<p class="font-caption text-caption text-on-surface-variant mt-xs">Contact your district coordinator if you are unable to access your assigned patient lists.</p>
</div>
</div>
</div>
</div>
</body></html>
