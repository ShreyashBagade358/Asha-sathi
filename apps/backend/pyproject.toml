[project]
name = "asha-sathi-backend"
version = "0.1.0"
description = "FastAPI backend for ASHA Sathi healthcare platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "fakeredis",
    "aiosqlite",
    "factory-boy",
    "faker",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "S324", "B008", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ASYNC100"]
"app/api/v1/vaccination.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.models.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
