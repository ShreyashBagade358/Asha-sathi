[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asha-sathi-ml"
version = "1.0.0"
description = "ML training pipeline for ASHA Sathi - maternal risk, child growth and NCD risk models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ASHA Sathi Team" }]
keywords = ["health", "maternal-health", "child-health", "ncd", "xgboost", "onnx"]

dependencies = [
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "onnx>=1.16",
  "onnxmltools",
  "skl2onnx>=1.16",
  "onnxruntime>=1.17",
  "shap>=0.44",
  "imbalanced-learn>=0.12",
  "joblib>=1.3",
  "pyyaml",
  "matplotlib",
  "seaborn",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "dvc[s3]",
  "jupyter",
]
serving = [
  "fastapi",
  "uvicorn[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --cov=src --cov-report=term-missing"
