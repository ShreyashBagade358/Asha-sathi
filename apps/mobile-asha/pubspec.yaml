name: mobile_asha
description: ASHA Sathi - Mobile app for Indian ASHA frontline health workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design system (monorepo package)
  asha_design_system:
    path: ../../packages/design-system/flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Offline-first database
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  sqflite: ^2.3.3

  # Networking & backend
  supabase_flutter: ^2.5.6
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Security
  flutter_secure_storage: ^9.2.2

  # UI / UX
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0
  file_picker: ^8.0.5
  intl: ^0.19.0
  image_picker: ^1.1.2

  # Notifications
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.1

  # Background sync
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
