<!-- Micro-interaction JS for OTP fields and Timer -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('otp-container');
            const inputs = container.querySelectorAll('input');

            // Handle Input behavior
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Restrict to numeric
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                });

                // Handle paste event across all fields
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, inputs.length);
                    
                    for (let i = 0; i < pastedData.length; i++) {
                        inputs[i].value = pastedData[i];
                        if (i < inputs.length - 1) {
                            inputs[i + 1].focus();
                        } else {
                            inputs[i].focus();
                        }
                    }
                });
            });

            // Mock Timer logic
            let timeLeft = 45;
            const timerEl = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            const timerInterval = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerEl.textContent = `00:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerEl.classList.add('hidden');
                    timerEl.previousElementSibling.classList.add('hidden'); // hide clock icon
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);
        });
    </script>
