<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ASHA Worker - Success</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#cadbfc",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#00752a",
                        "tertiary-fixed": "#b6ebff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#a9c7ff",
                        "surface-bright": "#f9f9ff",
                        "tertiary": "#004e61",
                        "surface-tint": "#005db6",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#00468c",
                        "on-secondary-fixed": "#002107",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#006880",
                        "on-primary-container": "#c8daff",
                        "on-surface-variant": "#424752",
                        "primary": "#00478d",
                        "outline": "#727783",
                        "surface-container-high": "#dfe8ff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#001f28",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-fixed": "#001b3d",
                        "secondary": "#006e28",
                        "primary-container": "#005eb8",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "surface": "#f9f9ff",
                        "inverse-surface": "#20314b",
                        "surface-container": "#e7eeff",
                        "on-tertiary-container": "#9be4ff",
                        "surface-container-highest": "#d6e3ff",
                        "secondary-container": "#82fc90",
                        "on-surface": "#091c35",
                        "error-container": "#ffdad6",
                        "background": "#f9f9ff",
                        "secondary-fixed-dim": "#65df77",
                        "on-secondary-fixed-variant": "#00531c",
                        "on-background": "#091c35",
                        "secondary-fixed": "#82fc90",
                        "outline-variant": "#c2c6d4",
                        "tertiary-fixed-dim": "#57d5fc",
                        "inverse-primary": "#a9c7ff",
                        "surface-variant": "#d6e3ff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#004e60",
                        "inverse-on-surface": "#ecf0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "xxl": "48px",
                        "unit": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "xs": "4px",
                        "form-gap": "20px",
                        "md": "16px",
                        "xl": "32px",
                        "touch-target": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "body-lg-mobile": ["Inter", "sans-serif"],
                        "caption": ["Inter", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg-mobile": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        /* Subtle background mesh for success screen */
        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, hsla(212,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(134,95%,85%,0.5) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-mesh">
<!-- Note: TopAppBar and BottomNavBar are deliberately suppressed here based on the 
         "Shell Visibility & Relevance - Automatic Suppression" rule for transactional/success screens. -->
<main class="w-full max-w-md mx-auto p-lg flex flex-col h-full min-h-[884px] justify-between relative z-10">
<!-- Top Section: Success Animation & Message -->
<div class="flex flex-col items-center pt-xl pb-lg animate-pop-in">
<div class="w-32 h-32 rounded-full bg-secondary-container flex items-center justify-center mb-md relative shadow-lg shadow-secondary-container/20">
<!-- Decorative concentric rings -->
<div class="absolute inset-0 rounded-full border-4 border-secondary-container opacity-30 scale-125"></div>
<div class="absolute inset-0 rounded-full border-2 border-secondary-container opacity-10 scale-150"></div>
<span class="material-symbols-outlined text-[72px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-xs">
                Registration Complete
            </h1>
<p class="font-body-lg-mobile text-body-lg-mobile text-on-surface-variant text-center max-w-[280px]">
                Health check-up data has been successfully recorded.
            </p>
</div>
<!-- Middle Section: Bento Grid Summary -->
<div class="flex-1 flex flex-col gap-md w-full my-auto">
<!-- Risk Indicator Card (High Priority visual weight) -->
<div class="bg-error-container rounded-3xl p-md flex items-start gap-md border-l-4 border-error shadow-sm animate-slide-up delay-100">
<div class="bg-error/10 rounded-full p-sm flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-error text-[28px]" style="font-variation-settings: 'FILL' 1;">
                        warning
                    </span>
</div>
<div class="flex-1 pt-1">
<h2 class="font-label-md text-label-md text-on-error-container/80 uppercase tracking-widest mb-xs">
                        Risk Indicator
                    </h2>
<p class="font-headline-md text-headline-md text-on-error-container leading-tight">
                        High-Risk Pregnancy
                    </p>
<div class="mt-sm inline-flex items-center gap-xs bg-error/20 px-sm py-xs rounded-full">
<span class="material-symbols-outlined text-on-error-container text-[16px]">
                            monitor_heart
                        </span>
<span class="font-caption text-caption text-on-error-container font-semibold">
                            Elevated Blood Pressure
                        </span>
</div>
</div>
</div>
<!-- Follow-up & Sync Grid -->
<div class="grid grid-cols-2 gap-md">
<!-- Follow Up Card -->
<div class="bg-surface-container-high rounded-3xl p-md flex flex-col items-center justify-center text-center shadow-sm animate-slide-up delay-200">
<div class="bg-primary-container/20 rounded-full p-sm mb-sm">
<span class="material-symbols-outlined text-primary text-[28px]">
                            calendar_month
                        </span>
</div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-xs">Next Visit</h3>
<p class="font-headline-md text-headline-md text-on-surface text-[22px]">
                        Oct 24
                    </p>
</div>
<!-- Offline Status Card -->
<div class="bg-surface-container rounded-3xl p-md flex flex-col items-center justify-center text-center shadow-sm border border-outline-variant/30 relative animate-slide-up delay-300">
<!-- Offline indicator dot -->
<div class="absolute top-md right-md w-3 h-3 rounded-full bg-outline shadow-sm"></div>
<div class="bg-surface-variant/50 rounded-full p-sm mb-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[28px]">
                            cloud_off
                        </span>
</div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-xs">Data Status</h3>
<p class="font-label-md text-label-md text-on-surface">
                        Stored Locally
                    </p>
<p class="font-caption text-caption text-on-surface-variant mt-xs">
                        Pending Sync
                    </p>
</div>
</div>
</div>
<!-- Bottom Section: Primary Actions -->
<div class="w-full flex flex-col gap-sm mt-xl pb-md animate-slide-up delay-300">
<button class="w-full h-touch-target bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-md flex items-center justify-center gap-sm active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">
                    dashboard
                </span>
                Go to Dashboard
            </button>
<button class="w-full h-touch-target bg-transparent border border-outline text-primary font-label-md text-label-md rounded-full flex items-center justify-center gap-sm active:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined">
                    person
                </span>
                View Patient Profile
            </button>
</div>
</main>
</body></html>
