services:
  - type: web
    name: asha-sathi-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: '["https://asha-sathi.vercel.app"]'
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "ap-southeast-1"
      - key: AWS_S3_BUCKET
        value: "ashasathi"
