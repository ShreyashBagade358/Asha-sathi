# =============================================================================
# ASHA Sathi - Staging environment overrides
#   helm upgrade --install asha-sathi . -f values.staging.yaml --namespace staging
# =============================================================================
global:
  environment: staging
  imageTag: staging
  imagePullSecrets:
    - ghcr-asha-sathi

backend:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi

web:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: 75m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi

ml:
  enabled: true
  replicaCount: 1

postgresql:
  enabled: true
  managePvc: false
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: "1"

redis:
  enabled: true

supabase:
  enabled: false

ingress:
  enabled: true
  hosts:
    - name: staging.api.asha-sathi.gov.in
      path: /api
      pathType: Prefix
      serviceName: asha-sathi-backend
      servicePort: 8000
    - name: staging.dashboard.asha-sathi.gov.in
      path: /
      pathType: Prefix
      serviceName: asha-sathi-web
      servicePort: 80

monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  grafana:
    enabled: true
