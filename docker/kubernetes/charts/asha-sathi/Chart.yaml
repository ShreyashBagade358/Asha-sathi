apiVersion: v2
name: asha-sathi
description: ASHA Sathi - healthcare platform for Indian ASHA frontline workers (FastAPI backend, React dashboard, ML serving, PostgreSQL, Redis)
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.24.0-0"

keywords:
  - healthcare
  - asha
  - frontline
  - india
  - maternal-health
  - abdm

home: https://asha-sathi.gov.in
sources:
  - https://github.com/yourorg/asha-sathi

maintainers:
  - name: ASHA Sathi Contributors
    email: devops@asha-sathi.gov.in

icon: https://raw.githubusercontent.com/yourorg/asha-sathi/main/docs/assets/asha-sathi-logo.png

dependencies:
  - name: postgresql
    version: "15.5.6"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database
  - name: redis
    version: "19.6.4"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    tags:
      - cache
  - name: prometheus
    version: "25.20.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
    tags:
      - observability
  - name: grafana
    version: "8.3.5"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
    tags:
      - observability
