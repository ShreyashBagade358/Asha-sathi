{{- if .Values.ml.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asha-sathi.fullname" . }}-ml
  labels:
    {{- include "asha-sathi.componentLabels" (dict "context" . "component" "ml") | nindent 4 }}
spec:
  replicas: {{ .Values.ml.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "asha-sathi.componentSelectorLabels" (dict "context" . "component" "ml") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asha-sathi.componentSelectorLabels" (dict "context" . "component" "ml") | nindent 8 }}
    spec:
      {{- include "asha-sathi.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.ml.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ml.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ml-serving
          image: {{ include "asha-sathi.image" (dict "context" . "image" .Values.ml.image) }}
          imagePullPolicy: {{ .Values.ml.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ML_MODEL_DIR
              value: /models
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ml.resources | nindent 12 }}
{{- end }}
