{{- if .Values.networkPolicy.enabled }}
# Default-deny network policy: only allow traffic that matches the explicit
# rules below. Prevents lateral movement between unrelated namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asha-sathi.fullname" . }}-default-deny
  labels:
    {{- include "asha-sathi.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    # DNS egress (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound internet for ABDM / Supabase / model registries
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asha-sathi.fullname" . }}-ingress
  labels:
    {{- include "asha-sathi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asha-sathi.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow from the ingress controller namespace(s)
    - from:
        {{- range .Values.networkPolicy.ingressControllerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    # Allow health probes and internal service-to-service calls from the namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asha-sathi.fullname" . }}-web-ingress
  labels:
    {{- include "asha-sathi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asha-sathi.componentSelectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressControllerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asha-sathi.fullname" . }}-ml-ingress
  labels:
    {{- include "asha-sathi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asha-sathi.componentSelectorLabels" (dict "context" . "component" "ml") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
