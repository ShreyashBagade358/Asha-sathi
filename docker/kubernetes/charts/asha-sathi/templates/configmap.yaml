apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "asha-sathi.configMapName" . }}
  labels:
    {{- include "asha-sathi.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.environment | quote }}
  API_V1_PREFIX: /api/v1
  SUPABASE_URL: {{ .Values.supabase.restUrl | default "https://YOUR_PROJECT.supabase.co" | quote }}
  CORS_ORIGINS: {{ printf "https://dashboard.%s" .Values.global.dnsDomain | quote }}
  # Non-secret runtime config only. Secrets live in the asha-sathi-secrets Secret.
