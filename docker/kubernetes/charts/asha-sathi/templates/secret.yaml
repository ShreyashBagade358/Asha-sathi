# =============================================================================
# EXAMPLE secret - DO NOT USE THESE VALUES IN PRODUCTION.
# Values below are placeholders so the chart renders and runs in a dev cluster.
# Override at install/upgrade time, e.g.:
#   helm upgrade asha-sathi . \
#     --set-file 'secretOverride.DATABASE_URL=/tmp/db.txt' \
#     --set 'secretOverride.JWT_SECRET=REPLACE_WITH_STRONG_SECRET'
# or with a values file containing `secretOverride: { ... }`.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asha-sathi.secretName" . }}
  labels:
    {{- include "asha-sathi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secretOverride.DATABASE_URL | default "postgresql+asyncpg://asha:CHANGE_ME_POSTGRES_PASSWORD@asha-sathi-postgres:5432/asha_sathi" | quote }}
  REDIS_URL: {{ .Values.secretOverride.REDIS_URL | default "redis://:CHANGE_ME_REDIS_PASSWORD@asha-sathi-redis-master:6379/0" | quote }}
  JWT_SECRET: {{ .Values.secretOverride.JWT_SECRET | default "CHANGE_ME_JWT_SECRET_4a1f9c3e7b2d8f5a1c3e7b2d8f5a1c3e" | quote }}
  SUPABASE_SERVICE_KEY: {{ .Values.secretOverride.SUPABASE_SERVICE_KEY | default "CHANGE_ME_SUPABASE_SERVICE_KEY" | quote }}
  SUPABASE_ANON_KEY: {{ .Values.secretOverride.SUPABASE_ANON_KEY | default "CHANGE_ME_SUPABASE_ANON_KEY" | quote }}
