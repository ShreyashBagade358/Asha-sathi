apiVersion: v1
kind: Service
metadata:
  name: {{ include "asha-sathi.fullname" . }}-backend
  labels:
    {{- include "asha-sathi.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "asha-sathi.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
