# =============================================================================
# Tempo - distributed tracing backend (OTLP gRPC/HTTP ingest)
# =============================================================================
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/metrics

search_enabled: true
trace_search_config:
  max_duration: 1h

querier:
  max_concurrent_queries: 10
  search:
    max_result_limit: 100

limits_config:
  max_bytes_per_trace: 5000000
  max_traces_per_user: 10000
