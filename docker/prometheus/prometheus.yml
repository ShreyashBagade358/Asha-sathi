# =============================================================================
# Prometheus scrape configuration for ASHA Sathi
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ${PROMETHEUS_ENV:-local}

rule_files:
  - /etc/prometheus/alerting.yml

scrape_configs:
  # FastAPI backend - /metrics exposed by prometheus-fastapi-instrumentator
  - job_name: "asha-backend"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          tier: app

  # PostgreSQL metrics via postgres_exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          tier: data

  # Host metrics via node_exporter
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
          tier: infra

  # Redis metrics (enable redis_exporter when added)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          tier: data
    # NOTE: add `redis-exporter` service to docker-compose.monitoring.yml
    # before enabling this job. Disabled targets produce no harm while absent.

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          tier: infra
