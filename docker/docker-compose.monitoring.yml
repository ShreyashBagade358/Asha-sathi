# =============================================================================
# ASHA Sathi - Observability stack (Prometheus / Grafana / Loki / Tempo)
# -----------------------------------------------------------------------------
# Extends the base compose stack so it joins the same `asha-net` network and
# can scrape the backend. Run with:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d \
#     prometheus grafana loki promtail tempo postgres-exporter node-exporter
#
# Endpoints:
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3001  (admin / admin by default, override GF_SECURITY_ADMIN_PASSWORD)
#   Loki        http://localhost:3100
#   Tempo (OTLP) grpc :4317  http :4318
#   postgres-exporter :9187   node-exporter :9100
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: asha-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - asha-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: asha-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - asha-net

  loki:
    image: grafana/loki:3.1.0
    container_name: asha-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - asha-net

  promtail:
    image: grafana/promtail:3.1.0
    container_name: asha-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - asha-net

  tempo:
    image: grafana/tempo:2.4.1
    container_name: asha-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - asha-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: asha-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://asha:asha_dev@postgres:5432/asha_sathi?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - asha-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: asha-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "9100:9100"
    networks:
      - asha-net

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
