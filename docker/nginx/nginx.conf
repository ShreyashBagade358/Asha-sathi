# =============================================================================
# nginx ingress for ASHA Sathi (production compose target)
# Routes:
#   /              -> web-dashboard (React, nginx :80)
#   /api/          -> backend (FastAPI :8000)
#   /metrics       -> backend (FastAPI, for scraping)
#   /auth|/rest|/realtime|/storage -> Supabase gateway (:18000 upstream on host)
#
# TLS: enable the 443 server block below and place your cert/key in
# ./nginx/certs/. The 80 server redirects to HTTPS.
# =============================================================================
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream dashboard {
        server web-dashboard:80;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80 default_server;
        server_name api.asha-sathi.gov.in dashboard.asha-sathi.gov.in;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name api.asha-sathi.gov.in dashboard.asha-sathi.gov.in;

        # ---- TLS (self-signed for testing; replace with your CA bundle) ----
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- API backend ----
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # ---- Prometheus metrics (internal; protect with allow-list if exposed) ----
        location = /metrics {
            proxy_pass http://backend;
        }

        # ---- Dashboard (SPA with client-side routing) ----
        location / {
            proxy_pass         http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
