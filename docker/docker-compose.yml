name: asha-sathi

# =============================================================================
# ASHA Sathi - Local development stack
# -----------------------------------------------------------------------------
# Usage:
#   docker compose up -d postgres redis backend web-dashboard adminer
#   docker compose --profile supabase up -d          # add the optional Supabase stack
#   docker compose --profile ml up -d                 # add the optional ML serving stack
#   docker compose down -v                            # teardown (with volumes)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 (primary application database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asha_sathi
      POSTGRES_USER: asha
      POSTGRES_PASSWORD: asha_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asha -d asha_sathi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - asha-net

  # ---------------------------------------------------------------------------
  # Redis 7 (cache, job queues, rate limiting, realtime presence)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asha-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asha-net

  # ---------------------------------------------------------------------------
  # Optional Supabase stack (Auth / PostgREST / Realtime / Storage)
  # Run with:  docker compose --profile supabase up -d
  # Gateway is exposed on host port 18000:
  #   /auth/v1   -> GoTrue        http://localhost:18000/auth/v1
  #   /rest/v1   -> PostgREST     http://localhost:18000/rest/v1
  #   /realtime/v1 -> Realtime    http://localhost:18000/realtime/v1
  #   /storage/v1 -> Storage API  http://localhost:18000/storage/v1
  # ---------------------------------------------------------------------------
  supabase-db:
    image: supabase/postgres:15.8.1.147
    profiles: ["supabase"]
    container_name: asha-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
    ports:
      - "54322:5432"
    volumes:
      - supabase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - asha-net

  supabase-kong:
    image: kong:2.8.1
    profiles: ["supabase"]
    container_name: asha-supabase-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    ports:
      - "18000:8000"
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - asha-net

  supabase-auth:
    image: supabase/gotrue:v2.150.0
    profiles: ["supabase"]
    container_name: asha-supabase-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:18000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000,http://localhost:5173
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-CHANGE_ME_JWT_SECRET_4a1f9c3e7b2d8f5a1c3e7b2d8f5a1c3e}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
    ports:
      - "9999:9999"
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - asha-net

  supabase-postgrest:
    # PostgREST is the image Supabase uses; it validates JWTs signed with
    # the shared SUPABASE_JWT_SECRET (PGRST_JWT_SECRET).
    image: postgrest/postgrest:v10.2.1
    profiles: ["supabase"]
    container_name: asha-supabase-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${SUPABASE_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-CHANGE_ME_JWT_SECRET_4a1f9c3e7b2d8f5a1c3e7b2d8f5a1c3e}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:18000
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - asha-net

  supabase-realtime:
    image: supabase/realtime:v2.30.8
    profiles: ["supabase"]
    container_name: asha-supabase-realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO public"
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-CHANGE_ME_JWT_SECRET_4a1f9c3e7b2d8f5a1c3e7b2d8f5a1c3e}
      SECRET_KEY_BASE: ${SUPABASE_REALTIME_SECRET:-CHANGE_ME_realtime_secret_base_0123456789012345}
      ERL_AFLAGS: "-kernel shell_history enabled"
      RLIMIT_NOFILE: "65536"
    ports:
      - "4000:4000"
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - asha-net

  supabase-storage:
    image: supabase/storage-api:v0.46.5
    profiles: ["supabase"]
    container_name: asha-supabase-storage
    restart: unless-stopped
    environment:
      # ANON_KEY / SERVICE_KEY must be JWTs signed with SUPABASE_JWT_SECRET.
      # Replace with real keys generated for your local stack (see README).
      ANON_KEY: ${SUPABASE_ANON_KEY:-CHANGE_ME_SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-CHANGE_ME_SUPABASE_SERVICE_KEY}
      POSTGREST_URL: http://supabase-postgrest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-CHANGE_ME_JWT_SECRET_4a1f9c3e7b2d8f5a1c3e7b2d8f5a1c3e}
      DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD:-postgres}@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      GLOBAL_S3_ENDPOINT: http://supabase-storage:5000
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    volumes:
      - minio-data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-postgrest:
        condition: service_started
    networks:
      - asha-net

  # ---------------------------------------------------------------------------
  # FastAPI backend (source mounted for hot reload)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    image: ghcr.io/yourorg/asha-sathi-backend:dev
    container_name: asha-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://asha:asha_dev@postgres:5432/asha_sathi
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:18000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-CHANGE_ME_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-CHANGE_ME_SUPABASE_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET_4a1f9c3e7b2d8f5a1c3e7b2d8f5a1c3e}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      API_V1_PREFIX: /api/v1
    volumes:
      - ../apps/backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - asha-net

  # ---------------------------------------------------------------------------
  # React dashboard (Vite build served by nginx)
  # ---------------------------------------------------------------------------
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    image: ghcr.io/yourorg/asha-sathi-web-dashboard:dev
    container_name: asha-web-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - asha-net

  # ---------------------------------------------------------------------------
  # Optional ML model serving (profile "ml")
  # ---------------------------------------------------------------------------
  ml-serving:
    build:
      context: ../apps/ml-training
      dockerfile: Dockerfile
    image: ghcr.io/yourorg/asha-sathi-ml-serving:dev
    profiles: ["ml"]
    container_name: asha-ml-serving
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ML_MODEL_DIR: /models
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ml-models:/models
    depends_on:
      - redis
    networks:
      - asha-net

  # ---------------------------------------------------------------------------
  # Adminer - lightweight DB console (optional utility)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: asha-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    networks:
      - asha-net

networks:
  asha-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  minio-data:
  supabase-db:
  ml-models:
