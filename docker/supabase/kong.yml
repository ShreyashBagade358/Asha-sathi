# =============================================================================
# Kong declarative config for the local Supabase gateway.
# Routes the Supabase service endpoints on the single gateway port.
# The upstream service names must match the docker compose service names.
# =============================================================================
_format_version: "1.1"
_transform: true

services:
  # GoTrue / Auth -----------------------------------------------
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # PostgREST / REST API ----------------------------------------
  - name: rest-v1
    url: http://supabase-postgrest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # Realtime ----------------------------------------------------
  - name: realtime-v1
    url: http://supabase-realtime:4000/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  # Storage API ------------------------------------------------
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

consumers: []

plugins:
  - name: cors
    service: null
    route: null
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - apikey
        - Content-Type
        - Prefer
        - X-Client-Info
        - Range
      exposed_headers:
        - Content-Range
        - Range
      credentials: false
      max_age: 3600
      preflight_continue: false
